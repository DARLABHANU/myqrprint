services:
  - type: web
    name: printly-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false